[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-guard"
version = "0.1.0"
description = "A typed-decision accuracy layer for RAG pipelines: relevance filtering, a pre-generation sufficiency gate, and post-generation grounding checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
typesafe = ["typesafe-sdk>=0.7"]
examples = ["chromadb>=0.5"]
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.10", "typesafe-sdk>=0.7"]

[tool.setuptools.packages.find]
include = ["rag_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
packages = ["rag_guard"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["openai.*", "anthropic.*", "chromadb.*", "typesafe_sdk.*"]
ignore_missing_imports = true
